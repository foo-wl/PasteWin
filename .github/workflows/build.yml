name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Needed to publish the rolling "nightly" release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # 需要 ARM64 时取消注释
          # - target: aarch64-pc-windows-msvc
          #   arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # NSIS only: produces a single setup.exe and skips the WiX/MSI pipeline,
      # which is the step that most often fails on a fresh runner.
      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pastewin-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      # Public download without logging in:
      # https://github.com/foo-wl/PasteWin/releases/download/nightly/PasteWin_0.1.0_x64-setup.exe
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Latest build
          prerelease: true
          body: |
            Automated build from `${{ github.sha }}` (${{ github.ref_name }}).
            Unsigned installer — SmartScreen will warn, choose "More info" → "Run anyway".
          files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
